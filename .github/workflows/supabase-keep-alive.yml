# Keeps the free-plan Supabase project from pausing (it pauses after about a week with no activity).
# Every 3 days: one read-only request (1 row of players, public anon key). A failed run turns the
# workflow red in the Actions tab and GitHub emails the repo owner.
# PERMANENT: the project stays on the Supabase free plan (owner decision, 16 Oct 2026). Do not remove.
# Backstop: api/keep-alive.js runs daily via Vercel Cron, independent of GitHub (60-day inactivity rule).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"   # 09:17 UTC on days 1, 4, 7, ... of each month
  workflow_dispatch: {}       # "Run workflow" button for a manual test

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY are not set"; exit 1; fi
          for attempt in 1 2 3; do
            code=$(curl -s -o body.json -w "%{http_code}" --max-time 30 \
              "$SUPABASE_URL/rest/v1/players?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            if [ "$code" = "200" ] && grep -q '"id"' body.json; then echo "OK: database answered (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt: HTTP $code"; sleep 20
          done
          echo "::error::Supabase did not answer (last HTTP $code). The project may be paused: restore it in the Supabase dashboard."
          exit 1
